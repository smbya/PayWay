version: "2"
sql:
  - schema: "internal/repository/db/schema.sql"
    queries: "internal/repository/db/query.sql"
    engine: "postgresql"
    database:
      uri: "postgres://user:password@db:5432/payway?sslmode=disable"
    gen:
      go:
        package: "query"
        out: "internal/repository/db/query"
        sql_package: "pgx/v5"